name: Negative test
on:
  push:
    branches: [ negative-test ]
permissions:
  id-token: write
  contents: read
jobs:
  try-assume:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::932878028796:role/sandbox-github-actions-helm-charts
          aws-region: us-east-1
